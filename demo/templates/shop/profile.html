{% extends "shop/base_shop.html" %}
{% block title %}My Profile - MyShop{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-3 mb-4">{% include "shop/_account_sidebar.html" %}</div>
    <div class="col-md-9">
        <div class="card shadow-sm">
            <div class="card-header fw-semibold">My Profile</div>
            <div class="card-body">
                {% for message in messages %}<div class="alert alert-success">{{ message }}</div>{% endfor %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" value="{{ request.user.username }}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        {{ form.email }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        {{ form.phone }}
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
